# Local authoring convenience ONLY — nothing in the running lab uses Docker or
# compose (D-58). The lab builds the image from the Dockerfile and runs the
# Quadlet unit in challenge.container.
services:
  wordpress:
    build: .
    hostname: wordpress
    domainname: chal.deti
    ports:
      - "8084:80"
    environment:
      FLAG: "flag{wordpress_local_verify}"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
