# Local-verification mirror of challenge.container (scripts/verify.py runs
# this). Keep in sync with the unit: same hardening, same mounts.
services:
  inj4:
    build: .
    hostname: inj4
    domainname: chal.deti
    ports:
      - "8043:8080"
    volumes:
      - ./local-flag:/flag:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 64
