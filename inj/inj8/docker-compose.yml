# Local-verification mirror of challenge.container (scripts/verify.py runs
# this). Keep in sync with the unit: same hardening, same mounts.
services:
  inj8:
    build: .
    hostname: inj8
    domainname: chal.deti
    ports:
      - "8047:8080"
    volumes:
      - ./local-flag:/flag:ro
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
