name: "sqli8"
author: "course staff"
# CTFd display name (the fictional app name). Per the naming policy the
# technique must not appear in name/title/description/tags; `title` is sent
# as the CTFd challenge name while the directory name stays the flag salt.
title: "TransferOps Console"
category: sqli
description: |
  The export is yours.
  It writes whatever you name.
  Some rows are kept out.

  http://sqli8.chal.deti:8037

  Difficulty: legendary.

  CWE: CWE-89
value: 500
type: standard
# Rolling flag, reseed variant: the flag lives in the challenge DATABASE, which
# is reconstructed from the live flag file on every container start (all seed
# data + the flag at the __FLAG__ placeholder). After each correct solve the
# watcher generates a new flag, pushes it to the flag folder and restarts the
# container so the DB picks it up; CTFd's single static flag follows.
# (rolling design: docs/plans/2026-10-09-rolling-flag-design.md; suite plan:
# docs/plans/2026-10-12-sqli-challenges.md, P4.1)
flag_mode: rolling
flag_uid: 1000
reseed: true

flags:
  - "flag{sqli8_local_verify}"   # replaced per deployment
tags:
  - sqli
  - web
connection_info: "http://sqli8.chal.deti:8037"
state: visible   # published 2026-10-16 (Update A: CTFd can now show them)
version: "0.1"
